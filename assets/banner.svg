<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">Dual-ISP Network Assessment</title>
  <desc id="d">Project banner: two routers on separate subnets joined by a NAS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2e"/>
      <stop offset="1" stop-color="#17365a"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="260" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="22" fill="url(#grid)"/>

  <!-- logo mark -->
  <g transform="translate(70 40)">
    <circle cx="90" cy="90" r="88" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <path d="M90 16 V58" stroke="#4d9be6" stroke-width="5" stroke-linecap="round" transform="translate(-38 0)"/>
    <path d="M90 16 V58" stroke="#9b82ea" stroke-width="5" stroke-linecap="round" transform="translate(38 0)"/>
    <rect x="22" y="58" width="60" height="40" rx="10" fill="#4d9be6"/>
    <rect x="98" y="58" width="60" height="40" rx="10" fill="#9b82ea"/>
    <circle cx="40" cy="78" r="4" fill="#0d1b2e"/><circle cx="54" cy="78" r="4" fill="#0d1b2e"/>
    <circle cx="116" cy="78" r="4" fill="#0d1b2e"/><circle cx="130" cy="78" r="4" fill="#0d1b2e"/>
    <path d="M52 98 V122 H74" fill="none" stroke="#4d9be6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M128 98 V122 H106" fill="none" stroke="#9b82ea" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="68" y="110" width="44" height="44" rx="9" fill="#e8eef6"/>
    <rect x="76" y="120" width="28" height="5" rx="2.5" fill="#0d1b2e"/>
    <rect x="76" y="130" width="28" height="5" rx="2.5" fill="#0d1b2e"/>
    <rect x="76" y="140" width="28" height="5" rx="2.5" fill="#0d1b2e"/>
  </g>

  <g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
    <text x="300" y="104" fill="#ffffff" font-size="46" font-weight="700">Dual-ISP Network Assessment</text>
    <text x="300" y="144" fill="#b9c8da" font-size="22">Finding and fixing a hidden subnet overlap between two ISP routers</text>
    <g font-size="16" font-weight="600">
      <rect x="300" y="170" width="84" height="34" rx="17" fill="#ffffff" fill-opacity="0.1"/>
      <text x="342" y="192" fill="#e8eef6" text-anchor="middle">Nmap</text>
      <rect x="394" y="170" width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.1"/>
      <text x="450" y="192" fill="#e8eef6" text-anchor="middle">Wireshark</text>
      <rect x="516" y="170" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.1"/>
      <text x="575" y="192" fill="#e8eef6" text-anchor="middle">PowerShell</text>
      <rect x="644" y="170" width="74" height="34" rx="17" fill="#ffffff" fill-opacity="0.1"/>
      <text x="681" y="192" fill="#e8eef6" text-anchor="middle">Bash</text>
      <rect x="728" y="170" width="88" height="34" rx="17" fill="#ffffff" fill-opacity="0.1"/>
      <text x="772" y="192" fill="#e8eef6" text-anchor="middle">Python</text>
      <rect x="826" y="170" width="130" height="34" rx="17" fill="#ffffff" fill-opacity="0.1"/>
      <text x="891" y="192" fill="#e8eef6" text-anchor="middle">TCP/IP · L2/L3</text>
    </g>
  </g>
</svg>
